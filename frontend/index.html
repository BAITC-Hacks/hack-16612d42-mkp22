<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <meta name="theme-color" content="#007f46">
  <meta name="description" content="" data-i18n-content="document.description">
  <title data-i18n="document.title"></title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#query" data-i18n="chat.skip"></a>
  <svg class="icon-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="m12 4 7 7M12 4l-7 7m7-7v16"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 1-8 8H4l1.5-4A8 8 0 1 1 20 11Z"/><path d="M8 10h8m-8 4h5"/></symbol>
    <symbol id="i-cart" viewBox="0 0 24 24"><path d="M3 3h2l3 12h11l2-9H6"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><path d="m12 3 9 5v9l-9 5-9-5V8l9-5Zm0 10v9M3 8l9 5 9-5M8 5l9 5"/></symbol>
    <symbol id="i-swap" viewBox="0 0 24 24"><path d="M4 7h16l-4-4m4 14H4l4 4M20 7l-4 4M4 17l4-4"/></symbol>
    <symbol id="i-truck" viewBox="0 0 24 24"><path d="M3 6h11v11H3V6Zm11 4h4l3 4v3h-7"/><circle cx="7" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v1"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H5v18h14V8l-5-5Zm0 0v5h5M8 12h8m-8 4h6"/></symbol>
  </svg>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/" aria-label="" data-i18n-aria="brand.home"><span class="brand-mark">ekt<span>.</span></span><span class="brand-name"><span data-i18n="brand.name"></span><small data-i18n="brand.tagline"></small></span></a>
      <div class="header-actions"><span class="service-label" data-i18n="brand.service"></span><label class="language-control"><span class="sr-only" data-i18n="language.label"></span><select id="language" aria-label="" data-i18n-aria="language.label"><option value="ru" lang="ru">RU</option><option value="kz" lang="kk">ҚАЗ</option><option value="en" lang="en">EN</option></select></label><button id="selection-open" data-i18n-aria="selection.title" data-i18n-title="selection.title" class="button button-secondary selection-trigger" type="button"><svg class="icon" aria-hidden="true"><use href="#i-cart"/></svg><span class="selection-label" data-i18n="selection.title"></span><span id="selection-count" class="count">0</span></button></div>
    </div>
  </header>
  <main class="page">
    <div class="page-heading"><div><div class="breadcrumb">EKT <span>/</span><span data-i18n="assistant.breadcrumb"></span></div><h1 data-i18n="assistant.title"></h1><p data-i18n="assistant.description"></p></div><span class="catalog-label"><svg class="icon" aria-hidden="true"><use href="#i-box"/></svg><span data-i18n="assistant.catalog"></span></span></div>
    <div class="assistant-layout">
      <section class="workspace" aria-label="" data-i18n-aria="assistant.chatLabel">
        <header class="chat-header"><div class="assistant-avatar" aria-hidden="true"><svg class="icon"><use href="#i-chat"/></svg></div><div class="chat-identity"><h2 data-i18n="assistant.name"></h2><p id="connection" role="status"><span class="status-dot"></span><span id="connection-text" data-i18n="connection.checking"></span></p></div><button id="reset" class="button button-quiet" type="button" aria-label="" data-i18n-aria="chat.new"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg><span data-i18n="chat.new"></span></button></header>
        <div class="conversation-wrap">
          <div id="conversation" class="conversation" role="log" aria-label="" data-i18n-aria="chat.messages" aria-live="polite" aria-relevant="additions">
            <section id="welcome" class="welcome" aria-labelledby="welcome-title">
              <div class="welcome-symbol" aria-hidden="true"><svg class="icon"><use href="#i-search"/></svg></div>
              <span class="eyebrow" data-i18n="assistant.eyebrow"></span><h2 id="welcome-title" data-i18n="assistant.welcome"></h2>
              <p data-i18n="assistant.welcomeDescription"></p>
              <div class="suggestions" aria-label="" data-i18n-aria="chat.examples">
                <button type="button" data-query="prompts.search.query"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg><span><b data-i18n="prompts.search.label"></b><small data-i18n="prompts.search.description"></small></span><svg class="icon prompt-arrow" aria-hidden="true"><use href="#i-arrow"/></svg></button>
                <button type="button" data-query="prompts.stock.query"><svg class="icon" aria-hidden="true"><use href="#i-box"/></svg><span><b data-i18n="prompts.stock.label"></b><small data-i18n="prompts.stock.description"></small></span><svg class="icon prompt-arrow" aria-hidden="true"><use href="#i-arrow"/></svg></button>
                <button type="button" data-query="prompts.analogue.query"><svg class="icon" aria-hidden="true"><use href="#i-swap"/></svg><span><b data-i18n="products.findAnalogue"></b><small data-i18n="prompts.analogue.description"></small></span><svg class="icon prompt-arrow" aria-hidden="true"><use href="#i-arrow"/></svg></button>
                <button type="button" data-query="prompts.delivery.query"><svg class="icon" aria-hidden="true"><use href="#i-truck"/></svg><span><b data-i18n="prompts.delivery.label"></b><small data-i18n="prompts.delivery.description"></small></span><svg class="icon prompt-arrow" aria-hidden="true"><use href="#i-arrow"/></svg></button>
              </div>
              <p class="welcome-note"><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg><span data-i18n="assistant.confirmationNote"></span></p>
            </section>
          </div>
          <button id="scroll-latest" class="button latest-button" type="button" hidden data-i18n="chat.latest"></button>
        </div>
        <div class="composer-area">
          <div id="error" class="error-banner" role="alert" hidden><div><strong id="error-title" data-i18n="errors.answerTitle"></strong><p id="error-message" tabindex="0"></p></div><button id="retry" class="button button-secondary" type="button" data-i18n="common.retry"></button><button id="error-close" class="icon-button" type="button" aria-label="" data-i18n-aria="errors.dismiss"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button></div>
          <form id="chat-form" class="composer"><label for="query" data-i18n="chat.label"></label><textarea id="query" rows="2" maxlength="2000" required aria-describedby="input-help" placeholder="" data-i18n-placeholder="chat.placeholder"></textarea><div class="composer-bottom"><span id="character-count" data-i18n="chat.inputHint"></span><button id="send" class="button button-primary" type="submit" disabled><span id="send-label" data-i18n="chat.send"></span><svg class="icon" aria-hidden="true"><use href="#i-send"/></svg></button></div></form>
          <div class="composer-help" id="input-help"><span class="keyboard-help" data-i18n="chat.keyboardHelp"></span><span data-i18n="chat.verifyNote"></span></div>
          <p class="data-language-note" data-i18n="language.dataNote"></p>
        </div>
      </section>
      <aside class="help-panel" aria-label="" data-i18n-aria="help.label">
        <div class="help-section"><span class="eyebrow" data-i18n="help.eyebrow"></span><h2 data-i18n="help.title"></h2><ol class="journey"><li><span>1</span><div><h3 data-i18n="help.searchTitle"></h3><p data-i18n="help.searchDescription"></p></div></li><li><span>2</span><div><h3 data-i18n="help.compareTitle"></h3><p data-i18n="help.compareDescription"></p></div></li><li><span>3</span><div><h3 data-i18n="help.confirmTitle"></h3><p data-i18n="help.confirmDescription"></p></div></li></ol></div>
        <div class="help-tip"><svg class="icon" aria-hidden="true"><use href="#i-info"/></svg><h3 data-i18n="help.tipTitle"></h3><p data-i18n="help.tipDescription"></p><button id="help-example" class="text-link" type="button"><span data-i18n="help.example"></span><span aria-hidden="true">↗</span></button></div>
        <div class="cart-availability"><svg class="icon" aria-hidden="true"><use href="#i-cart"/></svg><p><strong data-i18n="cart.about"></strong><span data-i18n="cart.availabilityNote"></span></p></div>
      </aside>
    </div>
  </main>
  <dialog id="product-dialog" class="modal" aria-labelledby="product-dialog-title"><div class="modal-header"><h2 id="product-dialog-title" data-i18n="products.detailsTitle"></h2><button class="icon-button" type="button" data-close="product-dialog" aria-label="" data-i18n-aria="products.closeDetails"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button></div><div id="product-detail" class="modal-body"></div></dialog>
  <dialog id="confirm-dialog" class="modal" aria-labelledby="confirm-title" aria-describedby="confirm-description"><form id="confirm-form"><div class="modal-header"><div><span class="eyebrow" data-i18n="confirmation.eyebrow"></span><h2 id="confirm-title" data-i18n="confirmation.title"></h2></div><button class="icon-button" type="button" data-close="confirm-dialog" aria-label="" data-i18n-aria="confirmation.close"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button></div><div class="modal-body"><p id="confirm-description" data-i18n="confirmation.description"></p><div id="confirm-items"></div><p id="confirm-total" class="confirm-total"></p><div class="notice"><svg class="icon" aria-hidden="true"><use href="#i-info"/></svg><p data-i18n="confirmation.notice"></p></div></div><div class="modal-footer"><button type="button" class="button button-secondary" data-close="confirm-dialog" data-i18n="common.cancel"></button><button id="confirm-submit" type="submit" class="button button-primary" data-i18n="confirmation.submit"></button></div></form></dialog>
  <dialog id="selection-dialog" class="modal" aria-labelledby="selection-title"><div class="modal-header"><div><span class="eyebrow" data-i18n="selection.eyebrow"></span><h2 id="selection-title" data-i18n="selection.title"></h2></div><button class="icon-button" type="button" data-close="selection-dialog" aria-label="" data-i18n-aria="selection.close"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button></div><div id="selection-content" class="modal-body"></div></dialog>
  <div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
</body>
</html>
